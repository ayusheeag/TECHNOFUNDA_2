name: Daily refresh

# Free replacement for a cron service: runs the nightly backend refresh against
# the external Postgres (Neon) — the heavy analytics (fundamentals, breadth,
# stage/RS, screener, re-rating, earnings snapshot, EOD bars). Prices + news are
# NOT here; the API fetches those live on-demand with a 15-min cache.
# 13:30 UTC = 7:00 PM IST (India is UTC+5:30, no DST).
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

concurrency:
  group: daily-refresh          # never overlap two refreshes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75         # weekly fundamentals sweep is ~30 min on the free tier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily_refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          APP_ENV: prod
        run: python daily_refresh.py
