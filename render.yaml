# Render Blueprint — TechnoFunda API (FastAPI).
#
# Reads the EXISTING Neon Postgres (kept fresh by the GitHub Actions nightly
# refresh) — there is no managed DB here. The web app (Next.js) is hosted on
# Vercel and points at this service via NEXT_PUBLIC_API_URL.
#
# After the first deploy, set the sync:false env vars in the service's
# Environment tab (see DEPLOY_HOSTING.md). ROTATE the API keys before going
# public — they were exposed in earlier logs.
#
# (The previous Streamlit-on-Render "Option B" is superseded; the live Streamlit
# app runs on Streamlit Community Cloud — see DEPLOY_STREAMLIT.md.)

services:
  - type: web
    name: technofunda-api
    runtime: python
    plan: starter                      # 512MB; bump to standard if memory-tight
    region: oregon                     # match your Neon region for low latency
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL              # paste the Neon connection string
        sync: false
      - key: CORS_ORIGINS              # the Vercel web origin, e.g. https://technofunda.vercel.app
        sync: false
      - key: FMP_API_KEY               # long daily history (5y) + fundamentals fallback
        sync: false
      - key: POLYGON_API_KEY           # news, intraday bars, quarterly financials
        sync: false
      - key: ALPHAVANTAGE_API_KEY      # (concall transcripts; optional)
        sync: false
      - key: EODHD_API_KEY             # (optional)
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
